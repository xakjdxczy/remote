name: Pack desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pack-desktop.yml"
      - "desktop/cpp/**"

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -B desktop/cpp/build -S desktop/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/cpp/build -j

      - name: Stage app
        run: |
          mkdir -p artifact
          ditto desktop/cpp/build/尘埃X.app artifact/尘埃X.app

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-macos
          path: artifact/尘埃X.app
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          cmake -B desktop/cpp/build -S desktop/cpp 2>&1 | tee cmake-configure.log
          cmake --build desktop/cpp/build --config Release --parallel 2>&1 | tee cmake-build.log

      - name: Upload Windows CMake logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-logs
          path: |
            cmake-configure.log
            cmake-build.log
          if-no-files-found: ignore

      - name: Stage zip
        shell: bash
        run: |
          set -euo pipefail
          test -f desktop/cpp/build/Release/DustX.exe
          test -f desktop/cpp/build/Release/web/shell.html
          test -f desktop/cpp/build/Release/web/remote-ui/js/app.js
          mkdir -p artifact/stage
          cp -R desktop/cpp/build/Release/. artifact/stage/
          if [ ! -f artifact/stage/web/remote-ui/js/app.js ]; then
            mkdir -p artifact/stage/web/remote-ui
            cp -R src/remote/web/. artifact/stage/web/remote-ui/
          fi
          (cd artifact/stage && /c/Windows/System32/tar.exe -a -c -f ../DustX-windows.zip *)
          python -c "import zipfile,sys; p='artifact/DustX-windows.zip'; sys.exit(0 if zipfile.is_zipfile(p) else 1)"
          ls -la artifact/DustX-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-windows
          path: artifact/DustX-windows.zip
          if-no-files-found: error
          retention-days: 14
