name: Pack desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pack-desktop.yml"
      - "desktop/**"
      - "src/remote/**"
      - "pyproject.toml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pack extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[pack,host]"

      - name: Build 尘埃X.exe
        run: python -m remote pack

      - name: Stage artifact
        shell: pwsh
        run: |
          $src = "desktop/windows/尘埃X"
          if (-not (Test-Path -LiteralPath $src)) {
            throw "pack finished but desktop/windows/尘埃X is missing"
          }
          $exe = Join-Path $src "尘埃X.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "尘埃X.exe is missing"
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $src -Destination "artifact/DustX" -Recurse
          Get-ChildItem -LiteralPath "artifact/DustX" | Select-Object -First 20 Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-windows
          path: artifact/DustX
          if-no-files-found: error
          retention-days: 14
