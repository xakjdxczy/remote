name: Pack desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pack-desktop.yml"
      - "desktop/**"
      - "src/remote/**"
      - "pyproject.toml"

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pack extras
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.0" "pywebview>=5.0" "mss>=9.0" "pynput>=1.7" "sounddevice>=0.5"
          if ! python -m pip install "pyvirtualcam>=0.11"; then
            echo "pyvirtualcam is optional; continuing without it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build DustX.exe
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m remote pack 2>&1 | tee pack.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-log
          path: pack.log
          if-no-files-found: ignore

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          src=""
          for cand in desktop/windows/DustX desktop/windows/尘埃X; do
            if [[ -d "$cand" ]]; then
              src="$cand"
              break
            fi
          done
          if [[ -z "$src" ]]; then
            echo "missing packed Windows folder" >&2
            ls -la desktop/windows || true
            ls -la dist || true
            exit 1
          fi
          mkdir -p artifact
          cp -R "$src" artifact/DustX
          ls -la artifact/DustX | head

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-windows
          path: artifact/DustX
          if-no-files-found: error
          retention-days: 14

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Pack failed"
            echo
            echo "Python: $(python -V 2>&1)"
            echo
            echo '```'
            tail -n 120 pack.log || true
            echo
            python -m pip list || true
            echo
            ls -la dist || true
            ls -la desktop/windows || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
