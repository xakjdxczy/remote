name: Pack desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pack-desktop.yml"
      - "desktop/cpp/**"

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -B desktop/cpp/build -S desktop/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/cpp/build -j

      - name: Stage app
        run: |
          mkdir -p artifact
          ditto desktop/cpp/build/尘埃X.app artifact/尘埃X.app

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-macos
          path: artifact/尘埃X.app
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          cmake -B desktop/cpp/build -S desktop/cpp 2>&1 | tee cmake-configure.log
          cmake --build desktop/cpp/build --config Release --parallel 2>&1 | tee cmake-build.log

      - name: Upload Windows CMake logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-logs
          path: |
            cmake-configure.log
            cmake-build.log
          if-no-files-found: ignore

      - name: Stage exe
        shell: bash
        run: |
          mkdir -p artifact/DustX
          cp desktop/cpp/build/Release/DustX.exe artifact/DustX/
          cp desktop/cpp/build/Release/DustXCam.dll artifact/DustX/
          cp desktop/cpp/build/Release/DustXMic.dll artifact/DustX/
          if [ -f desktop/cpp/build/Release/wintun.dll ]; then
            cp desktop/cpp/build/Release/wintun.dll artifact/DustX/
          fi
          cp -R desktop/cpp/web artifact/DustX/web
          if [ -d desktop/cpp/build/Release/platform-tools ]; then
            cp -R desktop/cpp/build/Release/platform-tools artifact/DustX/platform-tools
          fi
          ls -la artifact/DustX

      - uses: actions/upload-artifact@v4
        with:
          name: DustX-windows
          path: artifact/DustX
          if-no-files-found: error
          retention-days: 14
