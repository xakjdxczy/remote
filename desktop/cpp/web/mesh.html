<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>尘埃 · 跨网互访</title>
  <link rel="stylesheet" href="/cam.css" />
  <link rel="stylesheet" href="/mesh.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <h1>跨网互访</h1>
      <div id="mesh-status" class="pill">未上线</div>
    </header>
    <div class="home-grid">
      <article class="card">
        <div class="card-kicker">打开软件就会上线，关掉就下线。本机远程码在左侧栏，这里只填对方。可以同时连多台，每路一个本地端口。</div>
        <label class="id-label" for="mesh-peer-id">对方远程码</label>
        <div class="id-combo" id="mesh-id-combo">
          <input id="mesh-peer-id" class="mesh-input" placeholder="123 456 789" autocomplete="off" />
          <button type="button" class="combo-toggle" aria-label="历史连接">▾</button>
          <div class="combo-list" hidden></div>
        </div>
        <label class="id-label" for="mesh-peer-pass">对方密码</label>
        <div class="secret-wrap">
          <input id="mesh-peer-pass" class="mesh-input" type="password" placeholder="按住查看" autocomplete="new-password" spellcheck="false" />
          <button type="button" class="peek" id="mesh-peer-peek">查看</button>
        </div>
        <div class="pass-tools">
          <button id="mesh-connect" class="primary" type="button" style="margin-top:10px">连接对端</button>
          <button id="mesh-hangup" class="ghost" type="button">断开全部</button>
        </div>
        <p id="mesh-error" class="hint mesh-error" hidden></p>
        <div id="mesh-peers" class="mesh-peers"></div>
        <div class="id-label" style="margin-top:18px">本地连接记录</div>
        <p class="hint">关掉再开不会自动拨号。从这里点继续，或填识别码点连接对端。切标签不会断已建立的连接。</p>
        <div id="mesh-recents" class="mesh-peers"></div>
      </article>
      <article class="card">
        <div class="card-kicker">互访方式（两边可以选不一样）</div>
        <label class="mesh-mode" id="mesh-mode-tunnel-wrap">
          <input type="radio" name="mesh-mode" id="mesh-mode-tunnel" value="tunnel" checked />
          <span>
            <strong>应用层隧道</strong>
            <em>本机 127.0.0.1:本地端口 → 对端远程端口。Mac 默认这项，不装虚拟网卡。</em>
          </span>
        </label>
        <label class="mesh-mode" id="mesh-mode-tun-wrap">
          <input type="radio" name="mesh-mode" id="mesh-mode-tun" value="tun" />
          <span>
            <strong>虚拟网卡</strong>
            <em id="mesh-tun-hint">Windows 用 Wintun 分 100.x；Mac 没有项目自己的 Network Extension 许可时不可用。</em>
          </span>
        </label>
        <div class="mesh-row" style="margin-top:14px">
          <label class="mesh-field">SSH 账号
            <input id="mesh-ssh-user" class="mesh-input" placeholder="对端登录名，可空" />
          </label>
        </div>
        <div class="mesh-row">
          <label class="mesh-field">本地端口
            <input id="mesh-local-port" class="mesh-input" type="number" min="1" max="65535" value="2222" />
          </label>
          <label class="mesh-field">对端端口
            <input id="mesh-remote-port" class="mesh-input" type="number" min="1" max="65535" value="22" />
          </label>
        </div>
        <div class="mesh-row">
          <label class="mesh-field">本机 100.x
            <input id="mesh-local-ip" class="mesh-input" value="100.64.0.1" />
          </label>
          <label class="mesh-field">对端 100.x
            <input id="mesh-peer-ip" class="mesh-input" value="100.64.0.2" />
          </label>
        </div>
        <p id="mesh-ssh" class="hint"></p>
        <div id="mesh-ssh-panel" class="ssh-panel">
          <p id="mesh-ssh-status" class="hint"></p>
          <button id="mesh-ssh-enable" class="ghost" type="button" hidden>开启本机 SSH</button>
        </div>
        <p id="mesh-log" class="hint mesh-log"></p>
      </article>
    </div>
    <details class="log-box">
      <summary>运行日志</summary>
      <p id="dustx-log-path" class="hint"></p>
      <pre id="dustx-log" class="log-pre"></pre>
    </details>
  </div>
  <script src="/shell-bridge.js"></script>
  <script src="/ui.js"></script>
  <script src="/recents.js?v=sharepw1"></script>
  <script src="/logs.js"></script>
  <script src="/mesh.js?v=linkphase1"></script>
</body>
</html>
