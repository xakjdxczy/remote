[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remotedesk"
version = "0.1.0"
description = "A ToDesk-like remote assistance tool with device ID, screen sharing, and remote input."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xakjdxczy" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "pillow>=10",
]

[project.optional-dependencies]
host = [
    "mss>=9.0",
    "pynput>=1.7",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
remotedesk = "remote.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
