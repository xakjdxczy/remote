<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>字母陨石 · 26键大冒险 ｜ 黄土坡</title>
<meta name="description" content="黄土坡出品：字母陨石从天而降，按对应键将其击碎。按得越快攻击力越高，边玩边学 26 键盲打。" />
<link rel="stylesheet" href="/assets/css/game.css" />
</head>
<body>
<div class="game-shell">
  <header class="g-top">
    <a class="g-back" href="/">‹ 黄土坡</a>
    <div class="g-title">字母陨石 · <span>26键大冒险</span></div>
    <button id="sound-toggle" class="g-sound" title="音效开关">🔊</button>
  </header>

  <div class="hud">
    <div class="hud-item"><label>得分</label><b id="hud-score">0</b></div>
    <div class="hud-item"><label>连击</label><b id="hud-combo" class="combo">x0</b></div>
    <div class="hud-item attack">
      <label>攻击力 <span id="hud-attack">x1.0</span></label>
      <div class="attack-bar"><i id="attack-fill"></i></div>
    </div>
    <div class="hud-item"><label>等级</label><b id="hud-level">1</b></div>
    <div class="hud-item hp">
      <label>基地 HP</label>
      <div class="hp-bar"><i id="hp-fill"></i></div>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>

    <!-- overlays -->
    <div id="overlay-start" class="overlay">
      <div class="panel">
        <div class="big-emoji">⚡☄️</div>
        <h1>字母陨石</h1>
        <p class="lead">字母陨石正在坠落！按下对应的 <b>字母键</b> 击碎它们。<br />
          <b>按得越快，攻击力越高</b>；连击不断，得分翻倍。</p>
        <ul class="tips">
          <li>⌨️ 底部键盘会<b>高亮</b>当前来袭的字母 —— 边玩边记住 26 键位置</li>
          <li>🌈 按键盘的<b>手指配色</b>练习盲打（每种颜色对应一根手指）</li>
          <li>💥 陨石落到基地会扣血，连击清零；血量归零游戏结束</li>
        </ul>
        <button id="btn-start" class="g-btn">▶ 开始游戏（或按任意字母键）</button>
      </div>
    </div>

    <div id="overlay-over" class="overlay hidden">
      <div class="panel">
        <div class="big-emoji">🛰️💫</div>
        <h1>游戏结束</h1>
        <div class="final">
          <div><label>本局得分</label><b id="final-score">0</b></div>
          <div><label>最高连击</label><b id="final-combo">0</b></div>
          <div><label>历史最高</label><b id="final-best">0</b></div>
        </div>
        <p id="final-rank" class="rank"></p>
        <button id="btn-restart" class="g-btn">↻ 再来一局</button>
        <a class="g-btn ghost" href="/">返回黄土坡</a>
      </div>
    </div>
  </div>

  <div id="keyboard" class="keyboard"></div>
  <p class="finger-legend">
    <span class="lg lf-pinky">小指</span>
    <span class="lg lf-ring">无名</span>
    <span class="lg lf-mid">中指</span>
    <span class="lg lf-index">食指</span>
    <span class="lg rf-index">食指</span>
    <span class="lg rf-mid">中指</span>
    <span class="lg rf-ring">无名</span>
    <span class="lg rf-pinky">小指</span>
  </p>
</div>

<script src="/assets/js/game.js"></script>
</body>
</html>
